
name: PostgreSQL Auto Execute SQL

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - '.github/workflows/execute-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute SQL and maintain logs
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGDATABASE: ${{ secrets.DB_NAME }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGCONNECT_TIMEOUT: '10'
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p logs
          LOG_FILE="logs/deployment-${GITHUB_RUN_ID}.log"

          echo "Deployment started: $(date -Is)" > "$LOG_FILE"
          echo "Commit: $GITHUB_SHA" >> "$LOG_FILE"
          echo "Database: $PGDATABASE" >> "$LOG_FILE"

          failed=0
          found=0

          for file in sql/*.sql; do
            [ -f "$file" ] || continue
            found=1

            echo "Executing: $file" | tee -a "$LOG_FILE"

            if psql -X \
              --set ON_ERROR_STOP=1 \
              --single-transaction \
              --file="$file" >> "$LOG_FILE" 2>&1; then

              echo "SUCCESS: $file" | tee -a "$LOG_FILE"

            else
              echo "FAILED: $file" | tee -a "$LOG_FILE"
              failed=1
              break
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "FAILED: No SQL files found" >> "$LOG_FILE"
            failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "FINAL STATUS: SUCCESS" | tee -a "$LOG_FILE"
          else
            echo "FINAL STATUS: FAILED" | tee -a "$LOG_FILE"
          fi

          echo "Deployment finished: $(date -Is)" >> "$LOG_FILE"

          cat "$LOG_FILE"
          exit "$failed"

      - name: Save deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-deployment-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
