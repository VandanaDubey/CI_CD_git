
name: PostgreSQL Auto Execute SQL

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-sql:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute changed SQL files
        shell: powershell
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $logDir = Join-Path $env:GITHUB_WORKSPACE 'logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $logFile = Join-Path $logDir "deployment-$env:GITHUB_RUN_ID.log"

          function Write-Log([string]$Message) {
            $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') $Message"
            Add-Content -LiteralPath $logFile -Value $line
            Write-Host $line
          }

          $exitCode = 0

          try {
            Write-Log "START: PostgreSQL SQL deployment"
            Write-Log "Commit: $env:COMMIT_SHA"

            # Read credentials from the original local .env file.
            $envFile = 'D:\CI_CD_learning\CI_CD_git\.env'
            if (-not (Test-Path -LiteralPath $envFile)) {
              throw "Local environment file not found: $envFile"
            }

            foreach ($line in Get-Content -LiteralPath $envFile) {
              if ($line -match '^\s*#' -or $line -notmatch '=') {
                continue
              }

              $parts = $line -split '=', 2
              $key = $parts[0].Trim()
              $value = $parts[1].Trim()

              if ($value.Length -ge 2 -and
                  (($value.StartsWith('"') -and $value.EndsWith('"')) -or
                   ($value.StartsWith("'") -and $value.EndsWith("'")))) {
                $value = $value.Substring(1, $value.Length - 2)
              }

              switch ($key) {
                'PGHOST'     { $env:PGHOST = $value }
                'PGPORT'     { $env:PGPORT = $value }
                'PGDATABASE' { $env:PGDATABASE = $value }
                'PGUSER'     { $env:PGUSER = $value }
                'PGPASSWORD' { $env:PGPASSWORD = $value }
              }
            }

            foreach ($key in @('PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD')) {
              if (-not [Environment]::GetEnvironmentVariable($key)) {
                throw "Missing required setting: $key"
              }
            }

            $env:PGCONNECT_TIMEOUT = '10'
            $env:PGAPPNAME = 'GitHubActions-SQL-Deployment'

            $psql = Get-Command psql -ErrorAction SilentlyContinue
            if (-not $psql) {
              throw 'psql was not found in PATH. Add the PostgreSQL bin directory to PATH.'
            }

            Write-Log "Database client: $(& psql --version)"
            Write-Log "Database: $env:PGDATABASE"
            Write-Log "Host: $env:PGHOST; Port: $env:PGPORT"

            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              $files = @(git ls-files -- 'sql/*.sql')
            }
            elseif ($env:BEFORE_SHA -match '^0+$') {
              $files = @(git ls-files -- 'sql/*.sql')
            }
            else {
              $files = @(git diff --diff-filter=ACMR --name-only `
                $env:BEFORE_SHA $env:COMMIT_SHA -- 'sql/*.sql')
            }

            if ($LASTEXITCODE -ne 0) {
              throw 'Could not identify changed SQL files.'
            }

            $files = @($files | Where-Object { $_ -match '^sql/.+\.sql$' } | Sort-Object)

            if ($files.Count -eq 0) {
              Write-Log 'No added or modified SQL files to execute.'
            }

            foreach ($file in $files) {
              $fullPath = Join-Path $env:GITHUB_WORKSPACE ($file -replace '/', '\')

              if (-not (Test-Path -LiteralPath $fullPath)) {
                Write-Log "SKIPPED: $file is not present in this commit."
                continue
              }

              Write-Log "EXECUTING: $file"

              & psql -X --set ON_ERROR_STOP=1 --single-transaction --file="$fullPath" 2>&1 |
                ForEach-Object {
                  $message = "$_"
                  Add-Content -LiteralPath $logFile -Value $message
                  Write-Host $message
                }

              if ($LASTEXITCODE -ne 0) {
                Write-Log "FAILED: $file"
                throw "SQL execution failed for $file"
              }

              Write-Log "SUCCESS: $file"
            }

            Write-Log 'FINAL STATUS: SUCCESS'
          }
          catch {
            $exitCode = 1
            Write-Log "ERROR: $($_.Exception.Message)"
            Write-Log 'FINAL STATUS: FAILED'
          }
          finally {
            Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue
            Write-Log 'Deployment finished.'
          }

          if ($exitCode -ne 0) {
            exit 1
          }

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
