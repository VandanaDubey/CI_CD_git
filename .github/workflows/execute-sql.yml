
name: PostgreSQL Auto Execute SQL

on:
  push:
    branches:
      - main
    paths:
      - 'sql/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping deployment workflows in this repository.
concurrency:
  group: shared-postgresql-database-migrations
  cancel-in-progress: false

jobs:
  execute-sql:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute pending PostgreSQL migrations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $logDir = Join-Path $env:GITHUB_WORKSPACE 'logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $logFile = Join-Path $logDir "deployment-$env:GITHUB_RUN_ID.log"

          function Write-Log([string]$Message) {
            $line = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') $Message"
            Add-Content -LiteralPath $logFile -Value $line
            Write-Host $line
          }

          $exitCode = 0
          $wrapperPath = Join-Path $env:RUNNER_TEMP 'migration-wrapper.sql'

          try {
            Write-Log "START: PostgreSQL migration deployment"
            Write-Log "Commit: $env:GITHUB_SHA"

            # Load database settings from the runner's local .env file.
            $envFile = 'D:\CI_CD_learning\CI_CD_git\.env'

            if (-not (Test-Path -LiteralPath $envFile)) {
              throw "Local environment file not found: $envFile"
            }

            foreach ($line in Get-Content -LiteralPath $envFile) {
              if ($line -match '^\s*#' -or $line -notmatch '=') {
                continue
              }

              $parts = $line -split '=', 2
              $key = $parts[0].Trim()
              $value = $parts[1].Trim()

              if ($value.Length -ge 2 -and
                  (($value.StartsWith('"') -and $value.EndsWith('"')) -or
                   ($value.StartsWith("'") -and $value.EndsWith("'")))) {
                $value = $value.Substring(1, $value.Length - 2)
              }

              switch ($key) {
                'PGHOST'     { $env:PGHOST = $value }
                'PGPORT'     { $env:PGPORT = $value }
                'PGDATABASE' { $env:PGDATABASE = $value }
                'PGUSER'     { $env:PGUSER = $value }
                'PGPASSWORD' { $env:PGPASSWORD = $value }
              }
            }

            foreach ($key in @('PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD')) {
              if (-not [Environment]::GetEnvironmentVariable($key)) {
                throw "Missing required setting: $key"
              }
            }

            $env:PGCONNECT_TIMEOUT = '10'
            $env:PGAPPNAME = 'GitHubActions-SQL-Migrations'
            $env:PGSSLMODE = 'disable'

            $psql = Get-Command psql -ErrorAction SilentlyContinue
            if (-not $psql) {
              throw 'psql was not found in PATH.'
            }

            Write-Log "Client: $(& psql --version)"
            Write-Log "Database: $env:PGDATABASE"
            Write-Log "Host: $env:PGHOST; Port: $env:PGPORT"

            # Confirm that the shared migration history table exists.
            $tableCheck = & psql -X -A -t -c "SELECT to_regclass('public.schema_migrations') IS NOT NULL;"
            if ($LASTEXITCODE -ne 0 -or "$tableCheck".Trim() -ne 't') {
              throw 'public.schema_migrations does not exist or cannot be checked.'
            }

            # Read all tracked migration files, not the older sql/*.sql files.
            $files = @(git ls-files -- 'sql/migrations/' |
              Where-Object { $_ -match '^sql/migrations/[A-Za-z0-9_.-]+\.sql$' } |
              Sort-Object)

            if ($LASTEXITCODE -ne 0) {
              throw 'Could not list migration files.'
            }

            if ($files.Count -eq 0) {
              Write-Log 'No migration files found.'
            }

            foreach ($file in $files) {
              $version = [System.IO.Path]::GetFileNameWithoutExtension($file)

              # Validate version and script name before passing them to psql.
              if ($version -notmatch '^[A-Za-z0-9_.-]+$') {
                throw "Invalid migration filename: $file"
              }

              $fullPath = Join-Path $env:GITHUB_WORKSPACE ($file -replace '/', '\')

              if (-not (Test-Path -LiteralPath $fullPath)) {
                throw "Migration file not found: $file"
              }

              # psql's \i command uses forward slashes on Windows.
              $sqlPath = $fullPath -replace '\\', '/'

              Write-Log "CHECKING: $file"

              # One transaction per migration.
              # The advisory lock serializes deployments using this lock key.
              $wrapper = @"
          BEGIN;

          SELECT pg_advisory_xact_lock(741852963);

          SELECT EXISTS (
              SELECT 1
              FROM public.schema_migrations
              WHERE version = :'version'
                AND execution_status = 'SUCCESS'
          ) AS already_applied \gset

          \if :already_applied
          \echo SKIPPED: migration already recorded
          \else
          \echo EXECUTING: migration
          \i '$sqlPath'

          INSERT INTO public.schema_migrations
              (version, script_name, execution_status)
          VALUES
              (:'version', :'script_name', 'SUCCESS');

          \echo MIGRATION_RECORDED: success
          \endif

          COMMIT;
          "@

              [System.IO.File]::WriteAllText(
                $wrapperPath,
                $wrapper,
                [System.Text.UTF8Encoding]::new($false)
              )

              & psql -X --set=ON_ERROR_STOP=1 --set="version=$version" --set="script_name=$file" --file="$wrapperPath" 2>&1 |
                ForEach-Object {
                  $message = "$_"
                  Add-Content -LiteralPath $logFile -Value $message
                  Write-Host $message
                }

              if ($LASTEXITCODE -ne 0) {
                Write-Log "FAILED: $file"
                throw "Migration failed: $file"
              }

              Write-Log "COMPLETED: $file"
            }

            Write-Log 'FINAL STATUS: SUCCESS'
          }
          catch {
            $exitCode = 1
            Write-Log "ERROR: $($_.Exception.Message)"
            Write-Log 'FINAL STATUS: FAILED'
          }
          finally {
            Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $wrapperPath -ErrorAction SilentlyContinue
            Write-Log 'Deployment finished.'
          }

          if ($exitCode -ne 0) {
            exit 1
          }

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
